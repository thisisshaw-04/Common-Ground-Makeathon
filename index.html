<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffc814">
<title>Common Ground: A Creative Tech Makeathon</title>
<meta name="description" content="Different perspectives. One day to make something new. A one-day in-person makeathon bringing design, technology and culture together at SQ Collective.">
<link rel="icon" href="./assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./assets/portal.css?v=20261012-even-footer-divider">
<link rel="stylesheet" href="./assets/identity.css?v=20261012-schedule-full-bleed">
<link rel="stylesheet" href="./assets/project-modal.css?v=20261012-title-links">
<style>
#submission-form fieldset{border:1px solid var(--ink);border-radius:14px;padding:18px;margin:22px 0;min-width:0}
#submission-form legend{font:12px var(--mono);letter-spacing:.06em;padding:0 8px}
#submission-form legend small{display:block;color:var(--muted);font:11px var(--mono);letter-spacing:0;margin-top:5px}
#submission-form fieldset .field{margin:14px 0}
#submission-form .track-picker label{display:inline-flex;align-items:center;gap:7px;margin:10px 18px 4px 0;font-size:14px}
#submission-form input[type=checkbox]{accent-color:var(--acid);width:16px;height:16px;vertical-align:middle}
#submission-form [hidden]{display:none!important}

.project-gallery[hidden]{display:none!important}.project-gallery{scroll-margin-top:86px}
.project-gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
.project-gallery-card{border:1px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden}
.project-gallery-details>summary{list-style:none;cursor:pointer}
.project-gallery-details>summary::-webkit-details-marker{display:none}
.project-gallery-details>summary:focus-visible{outline:3px solid var(--hot);outline-offset:-4px}
.project-gallery-preview{position:relative;display:flex;min-height:190px;aspect-ratio:16/10;flex-direction:column;justify-content:space-between;gap:12px;padding:18px;overflow:hidden;background:linear-gradient(135deg,#ffd11a 0%,#ffe77d 58%,#fff7d6 100%);color:var(--ink)}
.project-gallery-preview:before{position:absolute;content:"";pointer-events:none}
.project-gallery-preview:before{width:210px;height:210px;right:-55px;top:-100px;border:1px solid rgba(20,20,20,.32);border-radius:50%;box-shadow:0 0 0 18px rgba(20,20,20,.06),0 0 0 38px rgba(20,20,20,.04)}
.project-gallery-preview.has-image{background:#e9e8e2}
.project-gallery-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.project-gallery-preview>strong{position:relative;z-index:1;max-width:82%}
.project-gallery-preview>strong{font-size:clamp(22px,3vw,34px);line-height:1.05;letter-spacing:-.05em}
.project-gallery-copy{display:grid;align-content:start;gap:9px;padding:18px 20px 20px}
.project-gallery-card h3{font-size:clamp(21px,3vw,29px);letter-spacing:-.04em;margin:0}
.project-gallery-card p{line-height:1.6;color:#333;white-space:pre-wrap;overflow-wrap:anywhere}
.project-gallery-card .gallery-team{font:11px var(--mono);color:var(--muted);text-transform:uppercase}
.project-gallery-card .gallery-credit{font:10px var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.project-gallery-tracks,.project-gallery-links{display:flex;gap:8px;flex-wrap:wrap}
.project-gallery-tracks span{font:10px var(--mono);padding:5px 8px;border:1px solid var(--ink);border-radius:999px;background:var(--acid)}
.project-gallery-tracks span.project-finalist-track{border-color:transparent;border-radius:5px;color:#fff;background:linear-gradient(#111,#111) padding-box,linear-gradient(115deg,#fff0a8,#7defff,#d5a2ff,#ff9bc9,#fff0a8) border-box;box-shadow:0 0 16px rgba(125,239,255,.18)}
.project-award-badge{display:grid;gap:3px;justify-items:start;width:fit-content;max-width:100%;padding:8px 11px;border:1px solid transparent;border-radius:5px;color:#fff;background:linear-gradient(#111,#111) padding-box,linear-gradient(115deg,#fff0a8,#7defff,#d5a2ff,#ff9bc9,#fff0a8) border-box;box-shadow:0 0 16px rgba(125,239,255,.18);font:10px var(--mono);letter-spacing:.04em}
.project-award-kicker{font-size:8px;letter-spacing:.09em;opacity:.75}
.project-award-badge strong{font:inherit;font-weight:600;text-transform:uppercase;overflow-wrap:anywhere}
.project-gallery-one-liner{margin:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.project-gallery-toggle{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-top:12px;border-top:1px solid var(--line);font:10px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.project-gallery-toggle>span:last-child{font-size:16px;transition:transform .18s ease}
.project-gallery-details[open] .project-gallery-toggle>span:last-child{transform:rotate(180deg)}
.project-gallery-expanded{display:grid;gap:12px;padding:0 20px 20px}
.project-gallery-card .submission-detail{margin-top:0;padding-top:12px;border-top:1px solid var(--line)}
.project-gallery-card .submission-detail strong{font:10px var(--mono);text-transform:uppercase;color:var(--muted)}
.project-gallery-card .submission-detail p{margin-top:5px;line-height:1.55;white-space:pre-wrap}
.project-gallery-links a{font:11px var(--mono);text-decoration:underline;text-underline-offset:3px}
.project-gallery-share-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:0 20px 18px}
.project-gallery-share{border:1px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);padding:8px 12px;font:10px var(--mono);cursor:pointer;transition:background .16s ease,transform .16s ease}
.project-gallery-share:hover:not(:disabled){background:#f2f2f2;transform:translateY(-1px)}
.project-gallery-share:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.project-gallery-share:disabled{opacity:.65;cursor:wait}


.portal-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;border:1px solid var(--ink);background:#fff;margin:22px 0 0;position:sticky;top:0;z-index:10}
.portal-tab{display:flex;align-items:center;justify-content:flex-start;gap:10px;min-height:54px;padding:10px 14px;border:1px solid var(--line-hard);background:var(--paper);color:var(--ink);font:500 14px var(--display);text-align:left}
.portal-tab:hover,.portal-tab.active{background:var(--acid);border-color:var(--ink)}
.tab-letter{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;font:12px var(--mono)}
.nav-note{grid-column:1/-1;padding:2px 6px;font:10px var(--mono);color:var(--muted)}
.portal-panel[hidden]{display:none!important}
.portal-panel{min-height:45vh}
#panel-overview .hero{padding-top:38px}
#panel-access .gate{margin:28px 0}
#panel-access .result{margin:24px 0}
#panel-choice .team-section{margin:28px 0}
#panel-choice #team-section,#panel-choice #submission-section{width:min(1840px,calc(100vw - 48px));margin-left:calc((100% - min(1840px,calc(100vw - 48px)))/2)}
#submission-form .submission-masonry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:20px}
#submission-form .submission-masonry-column{display:flex;flex-direction:column;gap:18px;min-width:0}
#submission-form .submission-masonry-column>.field,#submission-form .submission-masonry-column>fieldset{margin:0}
#submission-form .submission-masonry-column>fieldset{align-self:stretch}
#submission-form.media-edit-only .submission-masonry-column:first-child,#submission-form.media-edit-only .submission-masonry-column:nth-child(2){display:none}
#submission-form.media-edit-only .submission-masonry-column:last-child{grid-column:1/-1}
#submission-form.media-edit-only .submission-all-fields-note{display:none}
#submission-form.media-edit-only .submission-masonry-column:last-child>fieldset>:not(legend):not(.submission-media-note):not(.media-editable):not(#project-image-edit-deadline){display:none!important}
#submission-form.media-edit-only .media-editable{display:block}
#submission-form.media-edit-only .submission-actions #project-download{display:none}
@media(max-width:1000px){#submission-form .submission-masonry{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){#panel-choice #team-section,#panel-choice #submission-section{width:calc(100vw - 32px);margin-left:calc((100% - (100vw - 32px))/2)}#submission-form .submission-masonry{grid-template-columns:1fr}}
.submission-locked{margin:28px 0;padding:24px;border:1px solid var(--ink);background:#fff}
.submission-locked h2{font-size:clamp(24px,3vw,36px);margin:10px 0}
.submission-locked p{max-width:62ch;line-height:1.6;color:#55574e}
.event-live{border:1px solid var(--ink);background:#fff;padding:clamp(18px,3vw,30px);margin:10px 0 30px}
.event-live-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.event-live-top h3{font-size:clamp(20px,3vw,32px);margin:8px 0 0}
.event-countdown{display:grid;gap:8px;text-align:right}
.event-countdown span{font:10px var(--mono);letter-spacing:.08em;color:var(--muted)}
.event-countdown strong{font:600 clamp(20px,3vw,30px) var(--mono)}
.event-timeline{padding:24px 10px 4px}
.timeline-track{height:5px;background:#dedfd6;position:relative;margin:10px 0 16px}
.timeline-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink);transition:width .35s ease}
.timeline-cursor{position:absolute;top:50%;left:0;width:20px;height:20px;border-radius:50%;background:var(--acid);border:2px solid var(--ink);transform:translate(-50%,-50%);transition:left .35s ease;z-index:1}
.timeline-labels{display:flex;justify-content:space-between;gap:8px;position:relative}
.timeline-labels span{font:9px var(--mono);color:var(--muted);max-width:10ch;text-align:center}
.timeline-labels span:first-child{text-align:left}.timeline-labels span:last-child{text-align:right}
.timeline-labels span.active{color:var(--ink);font-weight:600}
.event-timezone{font:10px var(--mono);color:var(--muted);margin:12px 0 0}
.sched-row.is-active{background:#fff6d1;padding-left:12px;padding-right:12px}
.sched-row.is-active strong:after{content:' NOW';font:10px var(--mono);color:var(--ink);margin-left:8px}
.sched-row.is-complete time{color:var(--muted)}
.gallery-voting{border:1px solid var(--ink);background:#fff;padding:20px;margin:20px 0}
.gallery-voting h3{margin:8px 0;font-size:22px}
.gallery-voting p{margin:8px 0}
#people-choice-area{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,560px);gap:8px 32px;align-items:start}
#people-choice-area>.eyebrow{grid-column:1;grid-row:1}
#people-choice-title{grid-column:1;grid-row:2}
#people-choice-message{grid-column:1;grid-row:3}
#people-choice-area>.people-choice-auth{grid-column:2;grid-row:1/span 3;width:100%;max-width:none;margin-top:0}
@media(max-width:760px){#people-choice-area{grid-template-columns:1fr;gap:8px}#people-choice-area>.eyebrow,#people-choice-title,#people-choice-message,#people-choice-area>.people-choice-auth{grid-column:1;grid-row:auto}#people-choice-area>.people-choice-auth{margin-top:6px}}
.people-choice-auth{max-width:560px;margin-top:14px;padding:14px;border:1px solid var(--line-hard);border-radius:12px;background:#f1f1f1}
.people-choice-auth form#people-choice-signin-form{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px}
.people-choice-auth form#people-choice-code-form{display:grid;gap:10px}
.people-choice-auth .field{margin:0}
.people-choice-auth .field span{display:block;font:11px var(--mono);letter-spacing:.05em;color:var(--muted);margin-bottom:7px}
.people-choice-auth .field input{width:100%;min-height:44px;padding:11px 13px;border:1px solid var(--line-hard);border-radius:9px;background:#fff;color:var(--ink);font:14px 'Google Sans',sans-serif}
.people-choice-auth button.btn{min-height:44px;padding:10px 16px;white-space:nowrap}
.people-choice-auth form[hidden],.people-choice-auth [hidden]{display:none!important}
.people-choice-auth .helper.error{color:#9b1c1c}
.people-choice-auth button:disabled{opacity:.6;cursor:wait}
.people-choice-code-buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:560px){.people-choice-auth form#people-choice-signin-form{grid-template-columns:1fr}.people-choice-auth button.btn{width:100%}}
.people-choice-code-buttons .btn{flex:0 1 auto;width:auto;white-space:nowrap}
.gallery-vote-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0}
.gallery-vote-actions [data-vote-project]{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:auto;min-height:0;padding:12px 20px;font-size:13px;line-height:1.2}
.gallery-vote-actions [data-vote-project].btn-unvote{background:#000;color:#fff;border-color:#000}
.gallery-vote-actions [data-vote-project].btn-unvote:hover:not(:disabled){background:#202020;border-color:#202020}
.gallery-vote-actions .btn[disabled]{opacity:.55;cursor:not-allowed}
.gallery-vote-actions .vote-state{font:10px var(--mono);color:var(--muted)}
.gallery-refresh{margin:0 0 18px}
.gallery-phase-pills{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.gallery-phase-pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:2px solid var(--ink);border-radius:999px;background:transparent;font:12px var(--mono);letter-spacing:.04em;white-space:nowrap}
@media(max-width:700px){.portal-tabs{grid-template-columns:1fr;position:static}.portal-tab{min-height:46px}.event-countdown{text-align:left}.timeline-labels span{font-size:8px}.event-timeline{padding-left:0;padding-right:0}}
@media(prefers-reduced-motion:reduce){.timeline-fill,.timeline-cursor{transition:none}}
#gate-code-form[hidden],#gate-change-email[hidden]{display:none!important}



/* Keep the final submit action at the right end of the draft controls. */
.submission-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.submission-actions #project-ready{margin-left:auto;min-width:220px;min-height:54px;padding:14px 24px;border:1px solid var(--ink);border-radius:5px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.submission-actions #project-ready:hover:not(:disabled){background:#242424;transform:translateY(-2px);box-shadow:0 4px 0 var(--hot)}
.submission-actions #project-ready:active:not(:disabled){transform:translateY(0);box-shadow:0 1px 0 var(--hot)}
.submission-actions #project-ready:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.submission-actions #project-ready:disabled{opacity:.65;cursor:not-allowed;transform:none;box-shadow:none}
/* Make the primary submission tab easy to spot. */
#main-nav #nav-choice{min-height:44px;padding:7px 20px;border:1px solid var(--ink);border-radius:999px;background:var(--acid);color:var(--ink);font-size:clamp(14px,1.3vw,18px);font-weight:700}
#main-nav #nav-choice:hover,#main-nav #nav-choice[aria-selected="true"]{background:var(--acid);border-color:var(--ink)}
/* Full-bleed cover; keep the home footer in the first desktop view. */
body.builder-page{overflow-x:clip}
body.builder-page #panel-overview .hero{width:auto;margin-inline:calc(50% - 50vw)}
@media(min-width:981px){
  body.builder-page{min-height:100svh;display:flex;flex-direction:column}
  body.builder-page>.topbar{flex:0 0 auto}
  body.builder-page>#main-content{width:100%;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  body.builder-page #panel-overview{display:flex;flex:1 1 auto;flex-direction:column;min-height:0}
  body.builder-page #panel-overview .hero{flex:1 1 auto;min-height:0;padding-block:clamp(30px,4vh,52px)}
  body.builder-page>footer{flex:0 0 auto;width:100%;margin:0 auto;padding-block:clamp(12px,1.8vh,20px)}
}
</style>
</head>
<body class="builder-page">
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="topbar">
  <a class="brand" href="./" aria-label="Common Ground home"><span class="brand-mark" aria-hidden="true"></span>COMMON GROUND</a>

</header>

<main id="main-content">

<section class="portal-panel active" id="panel-choice" data-portal-panel="choice" role="tabpanel">
  <section class="section project-gallery" id="project-gallery" aria-labelledby="project-gallery-title">
    <div class="section-head">
      <h2 id="project-gallery-title">Project gallery</h2>
</div>
    <p id="project-gallery-message" class="helper" role="status">Voting is closed. Browse the submitted projects below.</p>
<button class="btn btn-sm gallery-refresh" id="gallery-refresh" type="button" hidden>Refresh projects</button>
    <div id="project-gallery-cards" class="project-gallery-grid"></div>
  </section>

  
</section>
</main>

<footer>
  <span>COMMON GROUND © 2026</span>
  <span id="foot-dates">SUNDAY, 11 OCTOBER 2026</span>
  <span>BUILD IN THE OPEN <b style="color:#fa1f93">✳</b></span>
</footer>

<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/backend-config.js?v=20261011"></script>
<script src="./assets/project-modal.js?v=20261011-project-modal"></script>
<script src="./assets/project-gallery.js?v=20261015-view-only"></script>
</body>
</html>
